{% extends 'base.html' %} 
{% load static %}

{% block style %}
    <link rel="stylesheet" href="{% static 'css/game/game_common.css' %}" />
    <link rel="stylesheet" href="{% static 'css/game/puzzles.css' %}" />
{% endblock %}

{% block page_name %}Пазлы{% endblock %}

{% block content %}
<div class="puzzle-page-wrapper">
    <!-- Левая часть: доска с пазлом -->
    <div id="puzzle-wrapper" class="puzzle-wrapper">
        <!-- Здесь скрипт вставит пазл -->
    </div>

    <!-- Правая часть: Панель настроек -->
    <div id="puzzles-settings" class="game-settings-panel">
        <h2>Настройки пазла</h2>

        <label for="puzzle-name">Название для сохранения:</label>
        <input type="text" id="puzzle-name" placeholder="Например: Мой первый пазл">

        <label>Выберите изображение для пазла:</label>
        <div class="presets-container">
            <img src="{% static 'images/british-cat.jpg' %}" class="preset" data-src="{% static 'images/british-cat.jpg' %}" alt="Британский кот">
            <img src="{% static 'images/tree.png' %}" class="preset" data-src="{% static 'images/tree.png' %}" alt="Дерево">
        </div>

        <label class="upload-label" style="font-weight: 600; color: #555; margin-bottom: 0.4rem; display: block;">
            Или загрузите своё:
        </label>
        <input type="file" id="custom-image" accept="image/*">
        
        <div id="image-preview-container" class="image-preview-container" style="display: none;">
            <img id="image-preview" src="#" alt="Предпросмотр">
            <p id="image-preview-text" style="margin-top: 0.5rem; color: #666; font-size: 0.9rem;">Используется загруженное изображение.</p>
        </div>

        <label for="difficulty">Выберите сложность:</label>
        <select id="difficulty">
            <option value="2" selected>2x2 (Легко)</option>
            <option value="3">3x3 (Средне)</option>
            <option value="4">4x4 (Сложно)</option>
        </select>
        
        <!-- Кнопки управления -->
        <div class="settings-buttons">
            <button id="start-game" class="game-btn game-btn-success">Начать игру</button>
            <button id="save-puzzle-btn" class="game-btn game-btn-primary">Сохранить</button>
            <button id="load-puzzle-btn" class="game-btn game-btn-secondary">Загрузить</button>
        </div>
    </div>
</div>

<!-- Модальное окно для загрузки пазлов  -->
<div id="load-puzzle-modal" class="modal-overlay">
    <div class="modal-container">
        <span class="modal-close-btn" id="load-cancel-btn">&times;</span>
        <h2>Выберите сохраненный пазл</h2>
        <div id="load-list-container" style="flex-grow: 1; overflow-y: auto; margin: 1rem 0; border: 1px solid #eee; border-radius: 8px; padding: 0.5rem;">
            <!-- Сюда JS добавит список пазлов -->
            <p class="text-center text-muted">Загрузка...</p>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <button id="load-cancel-btn" class="game-btn game-btn-secondary">Отмена</button>
            <button id="load-confirm-btn" class="game-btn game-btn-primary" disabled>Загрузить выбранный</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const isAuthenticated = {% if request.user.is_authenticated %}true{% else %}false{% endif %};
    const loginUrl = "{% url 'account:login' %}?next=" + window.location.pathname;
    const savePuzzleUrl = "{% url 'game:save_puzzle' %}";
    const updatePuzzleBaseUrl = "{% url 'game:update_puzzle' game_id="0" %}".replace('/0/', '/'); 
    const loadPuzzlesUrl = "{% url 'game:load_puzzles' %}";
    const csrfToken = "{{ csrf_token }}";
    const images = "{% static 'images' %}";
</script>
<script src="{% static 'js/game/puzzle.bundle.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if(typeof window.createPuzzleSeparately === 'function') {
            window.createPuzzleSeparately();
        } else {
            console.error("Функция createPuzzleSeparately не найдена.");
        }
    });
</script>
{% endblock %}
